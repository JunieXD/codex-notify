[package]
name = "codex-notify"
version = "0.4.1"
edition = "2024"
rust-version = "1.85"
description = "Cross-platform local notifications for Codex, starting with Feishu."
license = "MIT"
repository = "https://github.com/JunieXD/codex-notify"
readme = "README.md"
keywords = ["codex", "feishu", "notifications", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "codex-notify"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
dialoguer = "0.11"
directories = "6.0"
fs2 = "0.4"
flate2 = "1.1"
keyring = { version = "3.6", features = [
    "apple-native",
    "windows-native",
    "linux-native-sync-persistent",
    "crypto-rust",
] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
self-replace = "1.5"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.15"
toml_edit = { version = "0.22", features = ["serde"] }
zip = { version = "4.6", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
