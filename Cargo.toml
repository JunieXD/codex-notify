[package]
name = "codex-notify"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Cross-platform local notifications for Codex, starting with Feishu."
license = "MIT"
repository = "https://github.com/JunieXD/codex-notify"
readme = "README.md"
keywords = ["codex", "feishu", "notifications", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "codex-notify"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dialoguer = "0.11"
directories = "6.0"
keyring = "3.6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.15"
toml_edit = { version = "0.22", features = ["serde"] }
