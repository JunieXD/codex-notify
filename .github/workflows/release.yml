name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            target: x86_64-apple-darwin
            archive_format: tar.gz
            asset_name: codex-notify-x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
            archive_format: tar.gz
            asset_name: codex-notify-aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive_format: zip
            asset_name: codex-notify-x86_64-pc-windows-msvc
    env:
      TARGET: ${{ matrix.target }}
      ASSET_NAME: ${{ matrix.asset_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --locked --release --target "$TARGET"
        shell: bash
      - name: Package macOS artifact
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          tar -czf "dist/${ASSET_NAME}.tar.gz" \
            -C "target/${TARGET}/release" codex-notify \
            -C "${GITHUB_WORKSPACE}" README.md LICENSE
        shell: bash
      - name: Package Windows artifact
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path `
            "target/$env:TARGET/release/codex-notify.exe", `
            README.md, `
            LICENSE `
            -DestinationPath "dist/$env:ASSET_NAME.zip"
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --generate-notes
          gh release upload "$TAG" dist/* --clobber
